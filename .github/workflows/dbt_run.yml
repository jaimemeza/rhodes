name: Rhodes Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt update && sudo apt install cloudflared -y

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_key
          chmod 600 ~/.ssh/github_actions_key
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand /usr/bin/cloudflared access ssh --hostname %h
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/github_actions_key
            StrictHostKeyChecking no
          EOF

      - name: Run pipeline on Atlas
        run: |
          ssh ${{ secrets.SSH_HOST }} "bash -s" << ENDSSH
            set -e
            export RHODES_DB_PASSWORD="${{ secrets.RHODES_DB_PASSWORD }}"
            cd ~/projects/rhodes-homes

            echo "📦 Pulling latest code..."
            git pull

            echo "🐍 Activating venv..."
            source venv/bin/activate

            echo "💾 Running ingestion..."
            DATABASE_URL="postgresql://flux:${RHODES_DB_PASSWORD}@localhost:5432/rhodes_homes" \
            python ingestion/load_raw.py

            echo "🔧 Running dbt..."
            export RHODES_DB_PASSWORD="${RHODES_DB_PASSWORD}"
            cd dbt
            dbt seed
            dbt run
            dbt test

            echo "✅ Pipeline complete"
          ENDSSH
