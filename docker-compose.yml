services:
  streamlit:
    image: python:3.12-slim
    container_name: rhodes-streamlit
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./streamlit:/app
    command: >
      sh -c "pip install -r requirements.txt --quiet &&
             streamlit run Home.py --server.port=8501 --server.address=0.0.0.0"
    networks:
      - infrastructure_default

networks:
  infrastructure_default:
    external: true
